<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estación Meteorológica Pro</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h2, h3 { color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; }
    
    .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .input-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    
    .btn { padding: 12px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-submit { background: var(--primary); color: white; width: 100%; }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-pdf { background: #ef4444; color: white; margin-top: 20px; width: 100%; }
    
    .filters { background: #f1f5f9; padding: 15px; border-radius: 8px; margin: 20px 0; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .filters div { flex: 1; min-width: 140px; }
    
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 20px; }
    @media (max-width: 500px) { .charts-grid { grid-template-columns: 1fr; } }
    
    .chart-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; background: #fff; }
    .chart-container { width: 100%; height: 300px; }
    
    .status-msg { text-align: center; padding: 40px; color: #64748b; font-style: italic; }
  </style>
</head>
<body>

<div class="container">
  <h2>🛰️ Estación Meteorológica</h2>
  
  <form id="weatherForm">
    <div class="grid-form">
      <div class="input-group"><label>Fecha</label><input type="date" id="fecha" required></div>
      <div class="input-group"><label>Hora</label><input type="time" id="hora" required></div>
      <div class="input-group"><label>Temp (°C)</label><input type="number" id="temp" step="0.1" required></div>
      <div class="input-group"><label>Presión (hPa)</label><input type="number" id="presion" step="0.1" required></div>
      <div class="input-group"><label>Humedad (%)</label><input type="number" id="humedad" required></div>
      <div class="input-group"><label>Lluvia (mm)</label><input type="number" id="lluvia" step="0.1" value="0"></div>
      <div class="input-group"><label>Viento (Vel/Dir)</label><input type="text" id="viento" placeholder="15km/h N"></div>
      <div class="input-group">
        <label>Estado</label>
        <select id="estado">
          <option value="Soleado">☀️ Soleado</option>
          <option value="Nublado">☁️ Nublado</option>
          <option value="Semi-nublado">⛅ Semi-nublado</option>
          <option value="Lluvioso">🌧️ Lluvioso</option>
        </select>
      </div>
    </div>
    <button type="submit" id="submitBtn" class="btn btn-submit">Guardar Registro</button>
  </form>

  <h3>📊 Panel de Análisis</h3>
  <div class="filters">
    <div><label>Desde:</label><input type="date" id="filterFrom"></div>
    <div><label>Hasta:</label><input type="date" id="filterTo"></div>
    <button type="button" onclick="updateView()" class="btn" style="background: #64748b; color: white;">Filtrar</button>
  </div>

  <div id="charts_wrapper" class="charts-grid">
    <div class="status-msg" id="main-status">Iniciando sistema...</div>
  </div>
  
  <button type="button" onclick="generatePDF()" class="btn btn-pdf">📄 Descargar Reporte Completo</button>
</div>

<!-- Librerías Externas -->
<script src="https://www.gstatic.com/charts/loader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx5fyCFH7GwV7y7NPlpQqX1oLZ8AeUDXejui4FydtIg1aLWE_fi4R2LLHxYUGuJ97ak/exec';
let rawData = [];
let isChartsLibLoaded = false;

// Cargar motor de gráficos
google.charts.load('current', {'packages':['corechart']});
google.charts.setOnLoadCallback(() => {
    isChartsLibLoaded = true;
    fetchData();
});

// Manejador de Formulario compatible con Blogger
document.getElementById('weatherForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    e.stopPropagation(); // Evita que Blogger recargue la página

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = 'Procesando...';

    const payload = {
        fecha: document.getElementById('fecha').value,
        hora: document.getElementById('hora').value,
        temp: parseFloat(document.getElementById('temp').value),
        presion: parseFloat(document.getElementById('presion').value),
        humedad: parseFloat(document.getElementById('humedad').value),
        lluvia: parseFloat(document.getElementById('lluvia').value || 0),
        viento: document.getElementById('viento').value,
        estado: document.getElementById('estado').value
    };

    try {
        await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // Necesario para Google Apps Script
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        alert('✅ Registro guardado con éxito.');
        this.reset();
        setTimeout(fetchData, 2000); 
    } catch (error) {
        console.error("Error al enviar:", error);
        alert('❌ Error al conectar. Revisa la consola (F12).');
    } finally {
        btn.disabled = false;
        btn.innerText = 'Guardar Registro';
    }
});

// Función de obtención de datos robusta
async function fetchData() {
    const status = document.getElementById('main-status');
    try {
        const response = await fetch(WEB_APP_URL);
        if (!response.ok) throw new Error('Respuesta no válida');
        
        const data = await response.json();
        
        if (data && Array.isArray(data) && data.length > 1) {
            rawData = data.map((row, index) => {
                if (index === 0) return row;
                return [
                    String(row[0] || ""), 
                    String(row[1] || ""), 
                    parseFloat(row[2]) || 0, 
                    parseFloat(row[3]) || 0, 
                    parseFloat(row[4]) || 0, 
                    parseFloat(row[5]) || 0, 
                    String(row[6] || ""), 
                    String(row[7] || "")
                ];
            });
            updateView();
        } else {
            status.innerText = "Esperando primer registro de datos...";
        }
    } catch (error) {
        console.error("Fetch Error:", error);
        status.innerText = "Error al leer la base de datos. Verifica el despliegue.";
    }
}

function updateView() {
    if (!isChartsLibLoaded || rawData.length < 2) return;

    const from = document.getElementById('filterFrom').value;
    const to = document.getElementById('filterTo').value;

    let filtered = [rawData[0]];
    for (let i = 1; i < rawData.length; i++) {
        const rowDate = rawData[i][0];
        if ((!from || rowDate >= from) && (!to || rowDate <= to)) {
            filtered.push(rawData[i]);
        }
    }
    renderCharts(filtered);
}

function renderCharts(dataArray) {
    const wrapper = document.getElementById('charts_wrapper');
    wrapper.innerHTML = ''; 

    if (dataArray.length < 2) {
        wrapper.innerHTML = '<div class="status-msg">No hay datos en el rango seleccionado.</div>';
        return;
    }

    const dataTable = google.visualization.arrayToDataTable(dataArray);
    const configs = [
        { id: 't', title: 'Temperatura (°C)', col: 2, color: '#ef4444' },
        { id: 'p', title: 'Presión Atmosférica (hPa)', col: 3, color: '#3b82f6' },
        { id: 'h', title: 'Humedad (%)', col: 4, color: '#10b981' },
        { id: 'r', title: 'Precipitación (mm)', col: 5, color: '#f59e0b' }
    ];

    configs.forEach(conf => {
        const card = document.createElement('div');
        card.className = 'chart-card';
        card.innerHTML = `<h4>${conf.title}</h4><div id="c_${conf.id}" class="chart-container"></div>`;
        wrapper.appendChild(card);

        const view = new google.visualization.DataView(dataTable);
        view.setColumns([0, conf.col]);

        const chart = new google.visualization.LineChart(document.getElementById(`c_${conf.id}`));
        chart.draw(view, {
            legend: 'none',
            colors: [conf.color],
            hAxis: { slantedText: true, textStyle: { fontSize: 10 } },
            chartArea: { width: '85%', height: '70%' },
            curveType: 'function',
            pointSize: 4
        });
    });

    // Gráfico de Viento
    const windCard = document.createElement('div');
    windCard.className = 'chart-card';
    windCard.innerHTML = `<h4>Viento (Velocidad km/h)</h4><div id="c_v" class="chart-container"></div>`;
    wrapper.appendChild(windCard);

    const windView = new google.visualization.DataView(dataTable);
    windView.setColumns([0, {
        calc: (dt, row) => {
            const val = String(dt.getValue(row, 6));
            const num = parseFloat(val.replace(/[^0-9.]/g, ''));
            return isNaN(num) ? 0 : num;
        },
        type: 'number', label: 'Viento'
    }]);

    const windChart = new google.visualization.ColumnChart(document.getElementById('c_v'));
    windChart.draw(windView, { legend: 'none', colors: ['#6366f1'], chartArea: { width: '85%', height: '70%' } });
}

function generatePDF() {
    if (rawData.length < 2) return alert("No hay datos para exportar.");
    
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('l', 'mm', 'a4');
    const fDate = document.getElementById('filterFrom').value || 'Inicio';
    const tDate = document.getElementById('filterTo').value || 'Fin';

    doc.setFontSize(18);
    doc.setTextColor(37, 99, 235);
    doc.text('REPORTE METEOROLÓGICO', 14, 20);
    doc.setFontSize(10);
    doc.text(`Periodo: ${fDate} - ${tDate}`, 14, 28);

    const rows = [];
    for(let i=1; i<rawData.length; i++) {
        const d = rawData[i];
        if ((!fDate || d[0] >= fDate) && (!tDate || d[0] <= tDate)) {
            rows.push([d[0], d[1], d[2]+'°C', d[3]+'hPa', d[4]+'%', d[5]+'mm', d[6], d[7]]);
        }
    }

    doc.autoTable({
        startY: 35,
        head: [['Fecha', 'Hora', 'Temp', 'Presión', 'Hum', 'Lluvia', 'Viento', 'Estado']],
        body: rows,
        theme: 'striped',
        headStyles: { fillStyle: [37, 99, 235] }
    });

    doc.save(`Reporte_Clima_${Date.now()}.pdf`);
}
</script>
</body>
</html>
